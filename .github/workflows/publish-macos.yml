name: Publish macOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  publish-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore io.github.deplayeris.coffeeirc/io.github.deplayeris.coffeeirc.csproj
    
    - name: Publish for macOS x64 (NativeAOT)
      run: |
        dotnet publish io.github.deplayeris.coffeeirc/io.github.deplayeris.coffeeirc.csproj \
          -c Release \
          -r osx-x64 \
          -p:PublishAot=true \
          -p:OutputType=Exe
    
    - name: Publish for macOS ARM64 (NativeAOT)
      run: |
        dotnet publish io.github.deplayeris.coffeeirc/io.github.deplayeris.coffeeirc.csproj \
          -c Release \
          -r osx-arm64 \
          -p:PublishAot=true \
          -p:OutputType=Library
    
    - name: List native build output
      run: |
        echo "=== macOS x64 ==="
        ls -lh io.github.deplayeris.coffeeirc/bin/Release/net10.0/osx-x64/native
        echo "=== macOS ARM64 ==="
        ls -lh io.github.deplayeris.coffeeirc/bin/Release/net10.0/osx-arm64/native
    
    - name: Create tar.gz archives
      run: |
        cd io.github.deplayeris.coffeeirc/bin/Release/net10.0/osx-x64/native
        tar -czf ../../../../../coffeeirc-macos-x64.tar.gz *
        cd ../../osx-arm64/native
        tar -czf ../../../../../coffeeirc-macos-arm64.tar.gz *
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coffeeirc-macos
        path: |
          coffeeirc-macos-x64.tar.gz
          coffeeirc-macos-arm64.tar.gz
        retention-days: 730
