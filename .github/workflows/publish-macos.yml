name: Publish macOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  publish-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'ga'
    
    - name: Install Cake.Tool
      run: dotnet tool install -g Cake.Tool --version 4.0.0
    
    - name: Publish and Package macOS (x64 + ARM64)
      run: dotnet cake --target=Package-MacOS
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coffeeirc-macos
        path: |
          artifacts/coffeeirc-macos-x64.tar.gz
          artifacts/coffeeirc-macos-arm64.tar.gz
        retention-days: 730
