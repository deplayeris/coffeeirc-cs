name: Publish Linux

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  publish-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'ga'
    
    - name: Install NativeAOT dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev
    
    - name: Install Cake.Tool
      run: dotnet tool install -g Cake.Tool --version 4.0.0
    
    - name: Publish and Package Linux x64
      run: dotnet cake --target=Package-Linux
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: coffeeirc-linux-x64
        path: artifacts/coffeeirc-linux-x64.tar.gz
        retention-days: 730
