name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'ga'
    
    - name: Restore dependencies
      run: dotnet restore io.github.deplayeris.coffeeirc/io.github.deplayeris.coffeeirc.csproj
    
    - name: Build
      run: dotnet build io.github.deplayeris.coffeeirc/io.github.deplayeris.coffeeirc.csproj --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test
