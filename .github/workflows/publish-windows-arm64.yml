name: Publish Windows ARM64

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  publish-windows-arm64:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Install Cake.Tool
      run: dotnet tool install -g Cake.Tool --version 4.0.0
    
    - name: Publish and Package Windows ARM64
      run: dotnet cake --target=Package-Windows-Arm64
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: coffeeirc-windows-arm64
        path: artifacts/coffeeirc-windows-arm64.zip
        retention-days: 730
