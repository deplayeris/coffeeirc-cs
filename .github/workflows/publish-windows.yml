name: Publish Windows

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  publish-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'ga'
    
    - name: Install Cake.Tool
      run: dotnet tool install -g Cake.Tool --version 4.0.0
    
    - name: Publish and Package Windows x64
      run: dotnet cake --target=Package-Windows
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: coffeeirc-windows-x64
        path: artifacts/coffeeirc-windows-x64.zip
        retention-days: 730
