name: Publish Windows

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  publish-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore io.github.deplayeris.coffeeirc/io.github.deplayeris.coffeeirc.csproj
    
    - name: Publish for Windows x64 (NativeAOT)
      run: |
        dotnet publish io.github.deplayeris.coffeeirc/io.github.deplayeris.coffeeirc.csproj `
          -c Release `
          -r win-x64 `
          -p:PublishAot=true `
          -p:OutputType=Library
    
    - name: List published files
      run: dir io.github.deplayeris.coffeeirc\bin\Release\net10.0\win-x64\native
    
    - name: Create ZIP archive
      run: |
        Compress-Archive -Path io.github.deplayeris.coffeeirc/bin/Release/net10.0/win-x64/native/* -DestinationPath coffeeirc-windows-x64.zip
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: coffeeirc-windows-x64
        path: coffeeirc-windows-x64.zip
        retention-days: 730
